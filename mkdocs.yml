site_name: AI Telegram Bot
site_description: Production-grade Telegram AI assistant powered by Gemini 3 and Gemma 4
site_author: Oleksandr Myhydiuk
site_url: https://oleksandrmyhydiuk.github.io/ai-tg-bot/
repo_url: https://github.com/oleksandrmyhydiuk/ai-tg-bot
repo_name: oleksandrmyhydiuk/ai-tg-bot

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - CI/CD & Testing: cicd.md
  - API Reference:
      - Main & Entrypoint: api/main.md
      - Configuration: api/config.md
      - Database Engine & Models: api/database.md
      - Feature Modules: api/modules.md
      - Handlers: api/handlers.md
      - Context Builder: api/context_builder.md
      - Gemini & Gemma Client: api/gemini_client.md
      - Media Downloader: api/media_downloader.md
      - Summary Verifier: api/summary_verifier.md
