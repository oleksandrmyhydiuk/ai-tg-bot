name: CI

on:
  push:
    branches: ["main", "develop", "feat/*", "fix/*", "docs/*", "chore/*"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint and security tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Bandit security check
        run: bandit -r app -c pyproject.toml

      - name: Audit dependencies with pip-audit
        run: pip-audit -r requirements.txt

  test:
    name: Automated Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest coverage

      - name: Run automated test suite with coverage
        run: |
          coverage run -m pytest tests -v
          coverage report -m

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [lint-and-security, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-tg-bot:ci .

  deploy-docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    needs: [lint-and-security, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mkdocs-material "mkdocstrings[python]"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build documentation in strict mode
        env:
          BOT_TOKEN: "123456:DUMMY_FOR_DOCS"
          GEMINI_API_KEY: "DUMMY_KEY_FOR_DOCS"
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
