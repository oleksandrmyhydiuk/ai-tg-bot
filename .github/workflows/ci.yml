name: CI

on:
  push:
    branches: ["main", "develop", "feat/*", "fix/*", "docs/*", "chore/*"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint and security tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Bandit security check
        run: bandit -r app -c pyproject.toml

      - name: Audit dependencies with pip-audit
        run: pip-audit -r requirements.txt

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [lint-and-security, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-tg-bot:ci .
